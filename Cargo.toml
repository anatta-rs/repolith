[workspace]
resolver = "3"
members = [
    "crates/repolith-cli",
    "crates/repolith-actions",
    "crates/repolith-cache",
    "crates/repolith-core",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Multi-repo orchestration for Rust ecosystems (placeholder, in development)."
repository = "https://github.com/anatta-rs/repolith"
homepage = "https://github.com/anatta-rs/repolith"
authors = ["anatta-rs contributors"]
readme = "README.md"
keywords = ["multirepo", "orchestration", "build", "monorepo", "polyrepo"]
categories = ["development-tools"]

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
all = { level = "warn", priority = -1 }
