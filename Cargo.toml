[workspace]
resolver = "3"
members = [
    "crates/repolith-cli",
    "crates/repolith-actions",
    "crates/repolith-cache",
    "crates/repolith-core",
    "crates/repolith-engine",
]

[workspace.package]
version = "0.0.10"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Declarative orchestrator for Rust toolchains spread across multiple sibling git repositories."
repository = "https://github.com/anatta-rs/repolith"
homepage = "https://github.com/anatta-rs/repolith"
authors = ["anatta-rs contributors"]
readme = "README.md"
keywords = ["multirepo", "orchestration", "build", "monorepo", "polyrepo"]
categories = ["development-tools"]

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
all = { level = "warn", priority = -1 }
