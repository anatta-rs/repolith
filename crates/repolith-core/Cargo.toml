[package]
name = "repolith-core"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tokio-util = { version = "0.7", features = ["rt"] }
hex = "0.4"
toml = "0.8"
semver = "1.0"

[dev-dependencies]
serde_json = "1.0"
tokio = { version = "1.0", features = ["macros", "rt"] }
