[package]
name = "repolith-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true

[lints]
workspace = true

[dependencies]
# Diagnostic only. The action lifecycle belongs to `ProgressSink` —
# tracing never re-emits a start/done, so `-v` adds detail instead of
# repeating what the progress output already said.
tracing = "0.1"
async-trait = "0.1"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
tokio-util = { version = "0.7", features = ["rt"] }
hex = "0.4"
toml = "0.8"
semver = "1.0"
url = "2"

[dev-dependencies]
serde_json = "1.0"
tempfile = "3"
tokio = { version = "1.0", features = ["macros", "rt", "rt-multi-thread", "time"] }
