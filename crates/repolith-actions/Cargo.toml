[package]
name = "repolith-actions"
edition.workspace = true
version.workspace = true

[lints]
workspace = true

[dependencies]
repolith-core = { path = "../repolith-core" }
async-trait = "0.1"
sha2 = "0.10"
tokio = { version = "1.0", features = ["process", "macros", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.0", features = ["macros", "rt", "rt-multi-thread", "time"] }

[features]
default = []
git = []
cargo = []
