[package]
name = "repolith-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true

[lints]
workspace = true

[[bin]]
name = "repolith"
path = "src/main.rs"

[dependencies]
repolith-core = { path = "../repolith-core", version = "0.0.10" }
repolith-cache = { path = "../repolith-cache", version = "0.0.10", features = ["neo4j"] }
repolith-engine = { path = "../repolith-engine", version = "0.0.10" }
repolith-actions = { path = "../repolith-actions", version = "0.0.10", features = ["git", "cargo", "docker"] }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
comfy-table = "7"
dirs = "5"
num_cpus = "1"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
