[package]
name = "repolith-cli"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[[bin]]
name = "repolith"
path = "src/main.rs"

[dependencies]
repolith-core = { path = "../repolith-core" }
repolith-cache = { path = "../repolith-cache" }
repolith-engine = { path = "../repolith-engine" }
repolith-actions = { path = "../repolith-actions", features = ["git", "cargo"] }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
comfy-table = "7"
dirs = "5"
num_cpus = "1"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
