[package]
name = "repolith-cache"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true

[lints]
workspace = true

[dependencies]
# Diagnostic only. The action lifecycle belongs to `ProgressSink` —
# tracing never re-emits a start/done, so `-v` adds detail instead of
# repeating what the progress output already said.
tracing = "0.1"
repolith-core = { path = "../repolith-core", version = "0.0.12" }
async-trait = "0.1"
thiserror = "2.0"
rusqlite = { version = "0.31", features = ["bundled"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["rt", "macros", "time"] }
hex = "0.4"
neo4rs = { version = "0.8", optional = true }

[features]
default = []
neo4j = ["dep:neo4rs"]

[dev-dependencies]
tokio = { version = "1.0", features = ["macros", "rt", "rt-multi-thread"] }
tempfile = "3"
# Integration tests implement `Cache` themselves to pin the trait's
# default method bodies, which no shipped backend exercises.
async-trait = "0.1"
