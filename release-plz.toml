# release-plz configuration — https://release-plz.dev/docs/config
#
# The workspace releases in lockstep: every crate shares the root
# `workspace.package.version`, so one bump + one tag covers all five.

[workspace]
# Single root CHANGELOG.md (kept since 0.0.1) instead of per-crate files.
changelog_update = true
changelog_path = "CHANGELOG.md"
release_always = false
pr_name = "chore(release): v{{ version }}"
# Tags and GitHub Releases are disabled workspace-wide: with lockstep
# versions, every published package would otherwise try to create the
# same `v{{ version }}` tag and the second attempt dies on GitHub 422
# "Reference already exists" (see issue #64). Exactly one package —
# the CLI, below — carries the tag + Release for the whole workspace.
git_tag_enable = false
git_release_enable = false

[[package]]
name = "repolith-cli"
git_tag_enable = true
git_tag_name = "v{{ version }}"
git_release_enable = true
git_release_name = "v{{ version }}"
