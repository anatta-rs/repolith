# repolith orchestrating its own dev environment.
#
#   repolith status                    # what's stale, runs nothing
#   repolith sync --dry-run --explain  # why it's stale
#   repolith sync                      # do it
#
# Scope is this repository only. Sibling stacks in anatta-rs keep their own
# `repolith.toml`; a parent manifest one level up can pull them all together
# with `kind = "repolith"` nodes — that's what federation is for.

[orchestrator]
schema_version = "0.1"
name = "repolith-dev"

# repolith installs itself. `cargo install` needs a real package, and the
# workspace root is virtual, so the node points at the CLI crate rather than
# `.`. `crate` is the *binary* name (`[[bin]] name` in repolith-cli), which
# differs from the package name.
#
# Caveat worth knowing: the staleness digest covers `crates/repolith-cli`
# only. Editing `repolith-core` does not mark this node stale, because the
# digest does not follow path dependencies — use `cargo install` directly, or
# touch the CLI crate, until that gap is closed.
[[node]]
id = "repolith"
path = "crates/repolith-cli"

  [[node.action]]
  kind = "cargo-install"
  crate = "repolith"
  install_to = "~/.cargo"      # → ~/.cargo/bin/repolith, already on PATH

# release-plz warns on every run that this is missing; it gates the semver
# check on release PRs. No `path`, so cargo installs straight from the remote.
#
# `package` is what makes this node possible: the repository ships several
# packages with binaries (test fixtures), and cargo refuses to guess between
# them. `package` selects it; `crate` still names the binary target.
#
# Heads-up: long build the first time (large dependency tree).
[[node]]
id = "cargo-semver-checks"
git = "https://github.com/obi1kenobi/cargo-semver-checks"

  [[node.action]]
  kind = "cargo-install"
  package = "cargo-semver-checks"
  crate = "cargo-semver-checks"
  install_to = "~/.cargo"
